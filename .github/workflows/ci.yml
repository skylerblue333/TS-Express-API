name: express-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm run build
      - name: Tests
        run: pnpm exec jest --runInBand
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Build image
        run: docker build -t sky-express:ci .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-express:ci --format '{{.Config.User}}')" = "app"
      - name: Smoke-test runtime image
        run: |
          set -euo pipefail
          docker run -d --name sky-express-ci -p 3000:3000 sky-express:ci
          trap 'docker rm -f sky-express-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs sky-express-ci
          exit 1
